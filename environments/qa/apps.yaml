# ---------------------------------------------------------------------------
# Applications registered in the QA tenant.
# To register a new app: add an entry below, open a PR, review the plan, merge.
#
# app_type: spa | regular_web | native | non_interactive (machine-to-machine)
# ---------------------------------------------------------------------------
applications:
  - name: sample-portal-spa
    description: Customer portal (React SPA)
    app_type: spa
    callbacks:
      - https://portal.qa.Sunil Lab.com/callback
    logout_urls:
      - https://portal.qa.Sunil Lab.com
    web_origins:
      - https://portal.qa.Sunil Lab.com
    metadata:
      owner_team: web-platform

  - name: orders-sync-job
    description: Nightly job reading orders (machine-to-machine)
    app_type: non_interactive
    api_grants:
      - audience: https://orders-api.qa.Sunil Lab.com
        scopes: [read:orders]
    metadata:
      owner_team: orders
