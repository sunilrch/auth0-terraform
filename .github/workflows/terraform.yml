name: auth0-terraform

on:
  pull_request:
    paths: ["environments/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["environments/**", "modules/**", ".github/workflows/terraform.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  id-token: write   # for AWS OIDC (state backend)

jobs:
  terraform:
    name: ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true          # if one tenant fails, stop before the next
      max-parallel: 1          # apply dev -> qa -> staging -> prod in order
      matrix:
        env: [dev, qa, staging, prod]

    # GitHub Environment per tenant: holds that tenant's secrets and,
    # for staging/prod, required reviewers before apply.
    environment: ${{ github.event_name == 'push' && matrix.env || format('{0}-plan', matrix.env) }}

    defaults:
      run:
        working-directory: environments/${{ matrix.env }}

    env:
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
      AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
      TF_IN_AUTOMATION: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_STATE_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.4

      - name: fmt
        run: terraform fmt -check -recursive ../..

      - name: init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: validate
        run: terraform validate

      - name: plan
        id: plan
        run: terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/${{ matrix.env }}/plan.txt', 'utf8').slice(-60000);
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### Terraform plan — \`${{ matrix.env }}\`\n\`\`\`\n${plan}\n\`\`\``
            });

      - name: apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
